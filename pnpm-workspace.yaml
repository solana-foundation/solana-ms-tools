packages:
  - packages/*
  - '!**/test/**'
ignoredBuiltDependencies:
  - '@tailwindcss/oxide'
  - sharp
onlyBuiltDependencies:
  - '@swc/core'
  - esbuild
# Minimum release age in minutes (14 days)
# This delays installation of newly published packages to allow time for
# the community to identify and report malicious releases
minimumReleaseAge: 20160
